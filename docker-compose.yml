version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: fridge_fusion_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: fridge_fusion_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/fridge-fusion
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_key_here}
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: fridge_fusion_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
